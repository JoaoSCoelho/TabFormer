name: tabformer
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scikit-learn
  - tqdm
  # Instala o PyTorch 2.x mais recente. Se sua máquina tiver uma placa NVIDIA (como uma RTX),
  # ele já baixa os drivers CUDA 12.1. Se não tiver, ele roda perfeitamente na CPU.
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - pip:
      - transformers>=4.30.0 # Garante a versão moderna do Hugging Face
      - modal # Para você poder rodar o modal_train.py direto deste ambiente
